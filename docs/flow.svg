<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860"><rect width="1500" height="860" fill="#ffffff"/><text x="40" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#1a1d21" font-weight="bold" text-anchor="start">mistify — incident log analysis pipeline</text><text x="40" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5c6570" font-weight="normal" text-anchor="start">Flow and build status. Green: built and measured. Amber: built, unproven or incomplete. Grey: not started.</text><rect x="1090" y="36" width="16" height="16" rx="6" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.5"/><text x="1114" y="49" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">built + measured</text><rect x="1090" y="62" width="16" height="16" rx="6" fill="#fff6e5" stroke="#d98324" stroke-width="1.5"/><text x="1114" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">built, unproven</text><rect x="1090" y="88" width="16" height="16" rx="6" fill="#f1f3f5" stroke="#8b949e" stroke-width="1.5"/><text x="1114" y="101" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">not started</text><rect x="40" y="110" width="400" height="92" rx="6" fill="#fff6e5" stroke="#d98324" stroke-width="1.5"/><text x="54" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">1 · Ingest</text><text x="426" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#d98324" font-weight="bold" text-anchor="end">PHASE 1</text><text x="54" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">adapters/registry · auto-detect by confidence</text><text x="54" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">json_lines only · elastic, loki, otlp = Phase 4</text><text x="54" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">derive_incident_id · an incident begins here</text><line x1="240.0" y1="202" x2="240.0" y2="232" stroke="#5c6570" stroke-width="2"/><polygon points="235.0,224 245.0,224 240.0,232" fill="#5c6570"/><rect x="40" y="232" width="400" height="92" rx="6" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.5"/><text x="54" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">2 · Redact</text><text x="426" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e7a45" font-weight="bold" text-anchor="end">PHASE 1</text><text x="54" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">regex + entity hashing, before templating</text><text x="54" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">api_key, email, ipv4, ipv6, ssn · 7,282 on fixture</text><text x="54" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">opt-in reversible vault · mistify reveal</text><line x1="240.0" y1="324" x2="240.0" y2="354" stroke="#5c6570" stroke-width="2"/><polygon points="235.0,346 245.0,346 240.0,354" fill="#5c6570"/><rect x="40" y="354" width="400" height="110" rx="6" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.5"/><text x="54" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">3 · Template</text><text x="426" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e7a45" font-weight="bold" text-anchor="end">PHASE 2</text><text x="54" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">Drain3, sim_th calibrated per file</text><text x="54" y="417" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">over-merge detection · eviction tracked</text><text x="54" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">Loghub-2k grouping accuracy: mean 0.907</text><text x="54" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">OpenSSH 0.718 — structural, not a threshold</text><line x1="240.0" y1="464" x2="240.0" y2="494" stroke="#5c6570" stroke-width="2"/><polygon points="235.0,486 245.0,486 240.0,494" fill="#5c6570"/><rect x="40" y="494" width="400" height="110" rx="6" fill="#fff6e5" stroke="#d98324" stroke-width="1.5"/><text x="54" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">4 · Score anomalies</text><text x="426" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#d98324" font-weight="bold" text-anchor="end">PHASE 2</text><text x="54" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">severity × burstiness × rarity — no model</text><text x="54" y="557" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">signal set cut at the largest score gap</text><text x="54" y="574" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">chronic templates flagged (&gt;=90% of log span)</text><text x="54" y="591" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">no duration term in the score — Issue 8</text><line x1="240.0" y1="604" x2="240.0" y2="634" stroke="#5c6570" stroke-width="2"/><polygon points="235.0,626 245.0,626 240.0,634" fill="#5c6570"/><rect x="40" y="634" width="400" height="92" rx="6" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.5"/><text x="54" y="658" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">5 · Scratchpad (SQLite)</text><text x="426" y="658" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e7a45" font-weight="bold" text-anchor="end">PHASE 1-3</text><text x="54" y="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">templates · log_events · notes · query_log</text><text x="54" y="697" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">run_metadata · adversarial_objections</text><text x="54" y="714" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">read-only SQL channel, authorizer-enforced</text><rect x="520" y="110" width="400" height="128" rx="6" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.5"/><text x="534" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">6 · Investigation loop</text><text x="906" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e7a45" font-weight="bold" text-anchor="end">PHASE 3</text><text x="534" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">gemini-3.5-flash-lite · 4 tools</text><text x="534" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">query_templates · get_slice · run_sql · write_note</text><text x="534" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">read_notes · citation gate on unseen event ids</text><text x="534" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">history compaction &gt;20 lines · 48k tokens/run</text><text x="534" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">coverage nudge: signal unexplained -&gt; one more turn</text><line x1="720.0" y1="238" x2="720.0" y2="268" stroke="#5c6570" stroke-width="2"/><polygon points="715.0,260 725.0,260 720.0,268" fill="#5c6570"/><rect x="520" y="268" width="400" height="92" rx="6" fill="#f1f3f5" stroke="#8b949e" stroke-width="1.5"/><text x="534" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1d21" font-weight="bold" text-anchor="start">7 · Synthesis (disabled)</text><text x="906" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" font-weight="bold" text-anchor="end">HELD</text><text x="534" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">stronger model writes the conclusion from notes</text><text x="534" y="331" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">built, config default null, awaiting eval evidence</text><text x="534" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570" font-weight="normal" text-anchor="start">cannot introduce evidence — drops uncited ids