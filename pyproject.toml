[project]
name = "mistify"
version = "0.1.0"
description = "Incident log analysis agent — log compression plus a bounded agentic investigation loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75",
    "click>=8.1",
    "drain3>=0.9.11",
    "google-genai>=2.21.0",
    "jinja2>=3.1",
    "mcp>=1.2",
    "pydantic>=2.9",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
mistify = "mistify.cli:cli"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-python-dateutil>=2.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mistify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:mistify.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["mistify"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["drain3.*"]
ignore_missing_imports = true
