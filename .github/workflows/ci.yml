name: CI

# Documentation-only changes skip the run: nothing here reads the README, and a two-runner
# sweep for a prose edit is six runner-minutes for no information. If CI ever becomes a
# required check, a docs-only PR then needs a trivial always-pass workflow on these same paths.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra pdf

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      # No credential and no network: the model-driven tests run against a fake provider, the
      # Loghub and LogDx fetches are gated behind MISTIFY_NETWORK_TESTS=1, and the Loki
      # round-trip skips itself when no stack answers.
      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build
