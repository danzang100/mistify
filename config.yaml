# Mistify pipeline configuration.
# Validated against mistify.common.config.MistifyConfig; unknown keys are rejected.

pipeline:
  max_agent_tool_calls: 20
  # The whole conversation is re-sent every step, so an early slice is paid for on every step
  # after it. Older tool output is reduced to the summary line the tool already wrote; this is
  # how many recent steps keep their rows in full. 0 keeps everything.
  tool_result_history_steps: 3

adapters:
  auto_detect: true
  # Elastic still outstanding -- its export shape needs a live stack to fixture honestly, and
  # a hand-authored one gets the quirks wrong that the adapter exists to absorb. Loki's
  # fixtures come from `tests/fixtures/capture_loki.py` against a real collector.
  registered: [json_lines, loki, otlp]
  min_detect_confidence: 0.6
  # raw_lines | error. When nothing matches, read the file line by line and say so in the
  # report, rather than refusing it. An investigation that cannot start is not safer than one
  # that starts with less.
  on_unknown_format: raw_lines

bootstrap:
  # Off by default. The architecture calls this stage's failure silent -- a confidently wrong
  # schema yields garbage templates with no error thrown -- so inference is opted into. The
  # match-rate gate below runs either way and is never skipped.
  enabled: false
  # The structural pass costs nothing and handles most formats; this is the part that costs a
  # model call, and it only runs when structure alone was not enough.
  use_model: true
  sample_size: 100
  llm_fallback_sample_size: 40
  min_match_rate: 0.85

drain3:
  sim_th: 0.4                  # used directly when calibrate is false
  depth: 4
  max_clusters: 10000            # generous: eviction fragments template statistics
  # The ceiling used instead when calibration reports the file does not compress at all.
  # Drain3's per-line cost grows with the clusters it holds, and on a log where almost every
  # line is unique it holds one per line. Measured on a real CI log: 2.15x the throughput for
  # 0.17% more template fragmentation, because the templater keeps its own registry and
  # eviction loses no template from the report. Never applied to a file that did compress --
  # the run records which ceiling it used under templating.max_clusters.
  uncompressible_max_clusters: 2000
  persistence: file
  snapshot_path: .cache/drain3_{incident_id}.json
  # Try each candidate against a sample and keep the one whose compression ratio lands in
  # the band, rather than trusting one guess about an unseen file.
  calibrate: true
  calibration_candidates: [0.3, 0.4, 0.5]
  calibration_sample_size: 2000
  target_ratio_min: 0.002      # below this, distinct conditions may have been merged
  target_ratio_max: 0.30       # above this, almost no compression was achieved
  over_merge_severity_span: 3

anomaly:
  # Relative weights for the deterministic template score. Normalised before use.
  severity: 0.5
  burstiness: 0.3
  rarity: 0.2
  bucket_minutes: 1
  # Above this share of unmapped severities the severity term is treated as uninformative
  # and its weight is redistributed -- on an unlabelled log every line defaults to INFO, so
  # the heaviest component would otherwise be a constant.
  severity_unmapped_ceiling: 0.9
  # A template is noise when it is this share of the file AND scores below the ceiling.
  # Volume alone is not noise: a flood can be the incident.
  noise_share_threshold: 0.15
  noise_anomaly_ceiling: 0.35
  # Bounds on the "high anomaly" set the adversarial check must account for. The cut is
  # placed at the largest score gap, not at a fixed threshold.
  signal_min_templates: 3
  signal_max_templates: 15

redaction:
  mode: strict
  # Runs immediately after adapter parse(), before templating and before any model call.
  # `phone` is supported but off by default, and `credit_card` is out of scope for v1 --
  # both collide with numeric identifiers and neither has a checksum.
  entities: [api_key, email, ipv6, ipv4, ssn]
  salt: ""
  # Keep a reversible mapping so an operator can reveal values in their own logs. Off by
  # default: the vault is plaintext on disk. Written to its own file, never the scratchpad,
  # because the investigator's read-only SQL channel can read any table it is pointed at.
  vault: false
  vault_path: .cache/vault_{incident_id}.sqlite
  # Worker processes for redaction. 1 is serial; 0 means "use the machine's cores".
  # Redaction is ~42% of an ingest and the only stage that parallelises cleanly: 1.55x end to
  # end on a 400k-line BGL file with 8 workers, output byte-identical to serial. Amdahl caps
  # the whole run near 1.7x, so 16 workers measured only 1.59x -- 8 is where it stops paying.
  # Left at 1 because processes are not free and a small file finishes before a pool has
  # started; raise it for the gigabyte-scale runs it exists for. `vault: true` forces serial.
  workers: 1

scratchpad:
  path: .cache/incident_{incident_id}.sqlite
  # Whether the source line is kept verbatim beside the parsed message. On by default: `raw`
  # is the audit trail, what a reader greps to check a claim against the file it came from.
  #
  # Off is the largest single storage saving available, and only on structured formats --
  # measured 40.9% on JSON Lines (542 -> 320 bytes/event) and 0.0% on raw syslog, where the
  # two columns were already deduplicated against each other. No information is lost: the
  # timestamp, source, severity, message and remaining fields all keep their own columns.
  # What goes is the exact serialisation -- key order, spacing, the JSON envelope itself.
  store_raw: true

llm:
  # Gemini by default: a free AI Studio key is real API access, and the loop is ~15 calls
  # per investigation where the critique is one.
  provider: gemini
  model: gemini-3.5-flash-lite          # cheapest tier that still calls tools reliably
  # Writes the final conclusion once, from the scratchpad, after the loop has finished
  # searching. Search is mechanical and cheap; concluding is one call that might be worth
  # paying more for -- but that is a hypothesis, and `mistify eval` is how it gets tested.
  # Off until then: the shipped default should not change ahead of the evidence for it.
  # Set to a model (e.g. gemini-3.5-flash) to enable, and raise adversarial_model above it.
  synthesis_model: null
  # Must differ from whichever model writes the conclusion -- the loop's, or the synthesis
  # model when one is set. The critique cannot share a model with the thing it is checking
  # or it shares its blind spots. Enforced at config load.
  # A tier above the loop. gemini-3.6-flash was tried here and timed out repeatedly on the
  # critique prompt, taking a run's whole retry budget with it; 3.5-flash is the fallback.
  # Note this now matches judge_model, so `mistify eval --judge` will warn that the judge is
  # not independent of the critique -- true, and worth seeing rather than silently accepting.
  adversarial_model: gemini-3.5-flash
  bootstrap_model: gemini-3.5-flash-lite
  judge_model: gemini-3.5-flash
  max_tokens: 8192
  # No shipped provider supports task budgets, so this is inert today and the run is bounded
  # by pipeline.max_agent_tool_calls instead.
  task_budget_tokens: 64000
  # Measured: the free tier allows 15 requests/minute for gemini-3.5-flash-lite, and a failed
  # request counts, so a retry storm feeds itself. One investigation is ~12 calls, which fits;
  # two back to back do not. 4s spacing keeps a run inside the window. The adapter also honours
  # the retryDelay the API returns, which is the backstop when this is set too low.
  # Ceiling on one request. Without it the SDK waits forever -- a run was seen blocked in a
  # single call for over half an hour with its search already done. A timeout turns that into
  # DEADLINE_EXCEEDED, which the adapter already retries.
  request_timeout_seconds: 120.0
  min_interval_seconds: 4.0

report:
  # markdown | html | pdf. PDF needs the optional `pdf` extra: uv sync --extra pdf
  format: markdown
  output_dir: ./reports
