# Mistify pipeline configuration.
# Validated against mistify.common.config.MistifyConfig; unknown keys are rejected.

pipeline:
  max_agent_tool_calls: 20
  # The whole conversation is re-sent every step, so an early slice is paid for on every step
  # after it. Older tool output is reduced to the summary line the tool already wrote; this is
  # how many recent steps keep their rows in full. 0 keeps everything.
  tool_result_history_steps: 3

adapters:
  auto_detect: true
  # Phase 4 adds: elastic, loki, otlp
  registered: [json_lines]
  min_detect_confidence: 0.6

bootstrap:            # consumed from Phase 4
  sample_size: 100
  llm_fallback_sample_size: 40
  min_match_rate: 0.85

drain3:
  sim_th: 0.4                  # used directly when calibrate is false
  depth: 4
  max_clusters: 10000            # generous: eviction fragments template statistics
  persistence: file
  snapshot_path: .cache/drain3_{incident_id}.json
  # Try each candidate against a sample and keep the one whose compression ratio lands in
  # the band, rather than trusting one guess about an unseen file (architecture §6.1).
  calibrate: true
  calibration_candidates: [0.3, 0.4, 0.5]
  calibration_sample_size: 2000
  target_ratio_min: 0.002      # below this, distinct conditions may have been merged
  target_ratio_max: 0.30       # above this, almost no compression was achieved
  over_merge_severity_span: 3

anomaly:
  # Relative weights for the deterministic template score. Normalised before use.
  severity: 0.5
  burstiness: 0.3
  rarity: 0.2
  bucket_minutes: 1
  # Above this share of unmapped severities the severity term is treated as uninformative
  # and its weight is redistributed -- on an unlabelled log every line defaults to INFO, so
  # the heaviest component would otherwise be a constant.
  severity_unmapped_ceiling: 0.9
  # A template is noise when it is this share of the file AND scores below the ceiling.
  # Volume alone is not noise: a flood can be the incident.
  noise_share_threshold: 0.15
  noise_anomaly_ceiling: 0.35
  # Bounds on the "high anomaly" set the adversarial check must account for. The cut is
  # placed at the largest score gap, not at a fixed threshold.
  signal_min_templates: 3
  signal_max_templates: 15

redaction:
  mode: strict
  # Runs immediately after adapter parse(), before templating and before any model call.
  # `phone` is supported but off by default, and `credit_card` is out of scope for v1 --
  # both collide with numeric identifiers and neither has a checksum (decision G5).
  entities: [api_key, email, ipv6, ipv4, ssn]
  salt: ""
  # Keep a reversible mapping so an operator can reveal values in their own logs. Off by
  # default: the vault is plaintext on disk. Written to its own file, never the scratchpad,
  # because the investigator's read-only SQL channel can read any table it is pointed at.
  vault: false
  vault_path: .cache/vault_{incident_id}.sqlite

scratchpad:
  path: .cache/incident_{incident_id}.sqlite

llm:
  # Gemini by default: a free AI Studio key is real API access, and the loop is ~15 calls
  # per investigation where the critique is one.
  provider: gemini
  model: gemini-3.5-flash-lite          # cheapest tier that still calls tools reliably
  adversarial_model: gemini-3.5-flash   # must differ from `model` (architecture §6.3)
  bootstrap_model: gemini-3.5-flash-lite
  judge_model: gemini-3.5-flash
  max_tokens: 8192
  # No shipped provider supports task budgets, so this is inert today and the run is bounded
  # by pipeline.max_agent_tool_calls instead.
  task_budget_tokens: 64000
  # Measured: the free tier allows 15 requests/minute for gemini-3.5-flash-lite, and a failed
  # request counts, so a retry storm feeds itself. One investigation is ~12 calls, which fits;
  # two back to back do not. 4s spacing keeps a run inside the window. The adapter also honours
  # the retryDelay the API returns, which is the backstop when this is set too low.
  min_interval_seconds: 4.0

report:
  # markdown | html | pdf. PDF needs the optional `pdf` extra: uv sync --extra pdf
  format: markdown
  output_dir: ./reports
